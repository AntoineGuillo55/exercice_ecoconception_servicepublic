name: ecoindex-check
run-name: ${{github.actor}} is running ecoindex check
on: [workflow_dispatch]
jobs:
  launch-ecoindex-analysis:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # Chargement du contenu du repository
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      # Lancement de l'anaylse ecoindex via l'API pour la homepage
      - name: Launch analysis homepage
        id: lauchAnalysisHomepage
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/'
          method: 'POST'
          data: '{"web_page": {"width": 1920, "height": 1080, "url": "https://service-public.antoineguillo.com"}, "custom_headers": {"Accept": "application/json"}}'

      # Lancement de l'anaylse ecoindex via l'API pour la page de l'uf1 (demande carte nationale identité)
      - name: Launch analysis uf1
        id: lauchAnalysisUf1
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/'
          method: 'POST'
          data: '{"web_page": {"width": 1920, "height": 1080, "url": "https://service-public.antoineguillo.com/pages/carte-identite/etape-1.html"}, "custom_headers": {"Accept": "application/json"}}'
      
       # Lancement de l'anaylse ecoindex via l'API pour la page de l'uf2 (inscription sur les listes électorales)
      - name: Launch analysis uf2
        id: lauchAnalysisUf2
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/'
          method: 'POST'
          data: '{"web_page": {"width": 1920, "height": 1080, "url": "https://service-public.antoineguillo.com/pages/inscription-electorale/etape-1.html"}, "custom_headers": {"Accept": "application/json"}}'

      # Délai d'attente pour laisser le temps à l'analyse de se faire
      - name: Sleep for 180 seconds
        run: sleep 120s
        shell: bash

      # Récupération des données de l'analyse avec l'id retournée à l'étape launchAnalysisHomepage
      - name: Get analysis result
        id: getAnalysisHomempage
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/${{fromJson(steps.lauchAnalysisHomepage.outputs.response)}}'
          method: 'GET'

      # Récupération des données de l'analyse avec l'id retournée à l'étape launchAnalysisUf1
      - name: Get analysis result
        id: getAnalysisUf1
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/${{fromJson(steps.lauchAnalysisUf1.outputs.response)}}'
          method: 'GET'

      # Récupération des données de l'analyse avec l'id retournée à l'étape launchAnalysisHomepage
      - name: Get analysis result
        id: getAnalysisUf2
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/${{fromJson(steps.lauchAnalysisUf2.outputs.response)}}'
          method: 'GET'

      # Récupération de la date courante pour nommage du fichier
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      # Création d'un fichier pour stocker l'analyse
      - name: Store analysis
        id: storeAnalysis
        uses: 1arp/create-a-file-action@0.4.6
        with:
          path: 'docs/ecoindex'
          isAbsolutePath: 'false'
          file: ecoindex-analysis-${{steps.date.outputs.date}}-${{github.sha}}.json
          content: |
            ${{ steps.getAnalysisHomepage.outputs.response }}
            ${{ steps.getAnalysisUf1.outputs.response }}
            ${{ steps.getAnalysisUf2.outputs.response }}

      # Commit suite à la création du fichier
      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v7
    
