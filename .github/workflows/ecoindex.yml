name: ecoindex-check
run-name: ${{github.actor}} is running ecoindex check
on: [workflow_dispatch]

jobs:
  launch-ecoindex-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Chargement du contenu du repository
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      # Installation de jq pour parser le JSON
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Lancement de l'analyse ecoindex pour la homepage
      - name: Launch analysis homepage
        id: launchAnalysisHomepage
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/'
          method: 'POST'
          data: '{"web_page": {"width": 1920, "height": 1080, "url": "https://service-public.antoineguillo.com"}, "custom_headers": {"Accept": "application/json"}}'

      # Lancement de l'analyse ecoindex pour l'uf1
      - name: Launch analysis uf1
        id: launchAnalysisUf1
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/'
          method: 'POST'
          data: '{"web_page": {"width": 1920, "height": 1080, "url": "https://service-public.antoineguillo.com/pages/carte-identite/etape-1.html"}, "custom_headers": {"Accept": "application/json"}}'

      # Lancement de l'analyse ecoindex pour l'uf2
      - name: Launch analysis uf2
        id: launchAnalysisUf2
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.ecoindex.fr/v1/tasks/ecoindexes/'
          method: 'POST'
          data: '{"web_page": {"width": 1920, "height": 1080, "url": "https://service-public.antoineguillo.com/pages/inscription-electorale/etape-1.html"}, "custom_headers": {"Accept": "application/json"}}'

      # Vérification du statut de l'analyse homepage
      - name: Poll analysis homepage
        id: getAnalysisHomepage
        run: |
          TASK_ID=$(echo '${{ steps.launchAnalysisHomepage.outputs.response }}' | jq -r)
          STATUS=""
          MAX_ATTEMPTS=30
          ATTEMPT=0
          INTERVAL=10

          while [ "$STATUS" != "completed" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep $INTERVAL
            RESPONSE=$(curl -s "https://api.ecoindex.fr/v1/tasks/ecoindexes/$TASK_ID")
            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT: Status = $STATUS"
          done

          if [ "$STATUS" = "completed" ]; then
            echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          else
            echo "Timeout reached for task $TASK_ID"
            exit 1
          fi

      # Vérification du statut de l'analyse uf1
      - name: Poll analysis uf1
        id: getAnalysisUf1
        run: |
          TASK_ID=$(echo '${{ steps.launchAnalysisUf1.outputs.response }}' | jq -r)
          STATUS=""
          MAX_ATTEMPTS=30
          ATTEMPT=0
          INTERVAL=10

          while [ "$STATUS" != "completed" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep $INTERVAL
            RESPONSE=$(curl -s "https://api.ecoindex.fr/v1/tasks/ecoindexes/$TASK_ID")
            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT: Status = $STATUS"
          done

          if [ "$STATUS" = "completed" ]; then
            echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          else
            echo "Timeout reached for task $TASK_ID"
            exit 1
          fi

      # Vérification du statut de l'analyse uf2
      - name: Poll analysis uf2
        id: getAnalysisUf2
        run: |
          TASK_ID=$(echo '${{ steps.launchAnalysisUf2.outputs.response }}' | jq -r)
          STATUS=""
          MAX_ATTEMPTS=30
          ATTEMPT=0
          INTERVAL=10

          while [ "$STATUS" != "completed" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep $INTERVAL
            RESPONSE=$(curl -s "https://api.ecoindex.fr/v1/tasks/ecoindexes/$TASK_ID")
            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT: Status = $STATUS"
          done

          if [ "$STATUS" = "completed" ]; then
            echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          else
            echo "Timeout reached for task $TASK_ID"
            exit 1
          fi

      # Récupération de la date courante
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Création du fichier de stockage
      - name: Store analysis
        uses: 1arp/create-a-file-action@0.4.6
        with:
          path: 'docs/ecoindex'
          isAbsolutePath: 'false'
          file: ecoindex-analysis-${{steps.date.outputs.date}}-${{github.sha}}.json
          content: |
            ${{ steps.getAnalysisHomepage.outputs.response }}
            ${{ steps.getAnalysisUf1.outputs.response }}
            ${{ steps.getAnalysisUf2.outputs.response }}

      # Commit automatique
      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v7